<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/glopal.css" />

    <title>كاشير</title>
  </head>
  <body>
    <script src="assets/js/script.js"></script>
    <header
      class="bg-primary-dark shadow-lg flex flex-row items-center justify-between text-white py-2.5 px-5.5 font-cairo"
    >
      <div class="flex gap-2.5 items-center">
        <div
          class="bg-accent gap-2.5 rounded-xl flex text-primary-dark font-black items-center justify-center text-lg w-8.5 h-8.5"
        >
          ك
        </div>
        <div class="text-lg font-bold">كاشير البقالة</div>
      </div>
      <div class="flex p-1 gap-1.5 rounded-xl bg-glass cursor-pointer">
        <button
          id="first"
          class="py-2 px-4.5 rounded-lg font-semibold text-sm tab cursor-pointer"
          onclick="changeTabs(this)"
        >
          الكاشير
        </button>
        <button
          id="scound"
          class="py-2 px-4.5 rounded-lg font-semibold text-sm cursor-pointer"
          onclick="changeTabs(this)"
        >
          المخزون
        </button>
        <button
          id="thered"
          class="py-2 px-4.5 rounded-lg font-semibold text-sm cursor-pointer"
          onclick="changeTabs(this)"
        >
          التقارير
        </button>
      </div>
      <div>20/8/2026 1:00م</div>
    </header>
    <div
      class="pt-4.5 px-5.5 pb-10 my-0 mx-auto h-max-auto bg-bg gap-4.5 flex flex-col lg:flex-row"
    >
      <!-- right -->
      <div class="flex-1 bg-surface rounded-lg shadow-lg p-4">
        <div>
          <input
            type="text"
            id="searchInput"
            placeholder="ابحث بالاسم أو الكود..."
            class="flex-1 py-3 px-3.5 border-[1.5px] rounded-lg text-[15px] gap-2.5 border-line w-full"
          />
        </div>
        <div class="gap-2 mb-3.5 flex-wrap my-3.5 cursor-pointer">
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent activeChip chip cursor-pointer"
            onclick="changeChips(this)"
          >
            الكل
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            مواد غذائية
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            مشروبات
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            مخبوزات
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            ألبان
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            خضار وفاكهة
          </button>
          <button
            class="py-1.5 px-3.5 rounded-3xl bg-primary-tint text-primary-dark text-[13px] font-semibold border-[1.5px] border-transparent chip cursor-pointer"
            onclick="changeChips(this)"
          >
            منتجات منزلية
          </button>
        </div>
        <div
          id="cards"
          class="gap-3 pe-1 flex flex-wrap overflow-y-auto min-h-35 max-h-[62vh]"
        ></div>
      </div>
      <!-- left -->
      <div class="bg-surface rounded-lg shadow-lg p-4 lg:w-95">
        <div class="font-cairo justify-between items-center flex flex-row">
          <div class="font-bold text-lg">الفاتورة الحالية</div>
          <button class="text-danger text-xs font-bold">تفريغ السلة</button>
        </div>
        <div class="text-ink-soft text-center py-7.5 px-0 text-sm">
          السلة فاضية. اختر منتج للبدء
        </div>
        <div
          class="justify-between flex bg-led-bg py-4 px-5 rounded-lg my-2.5 mx-0 items-center"
        >
          <div class="text-text text-xs font-bold font-cairo">الإجمالي</div>
          <div class="text-led-text font-black font-cairo text-2xl">0.00</div>
        </div>
        <div class="flex items-center gap-2.5 my-2.5 mx-0">
          <label class="text-sm font-bold text-ink-soft">المدفوع</label>
          <input
            type="number"
            placeholder="0.00"
            class="flex-1 py-2.5 px-3 rounded-lg border-[1.5px] border-line text-base font-cairo font-bold text-left"
          />
        </div>
        <div
          class="justify-between flex bg-led-bg py-4 px-5 rounded-lg my-2.5 mx-0 items-center"
        >
          <div class="text-text text-xs font-bold font-cairo">
            الباقي للعميل
          </div>
          <div class="text-led-text font-black font-cairo text-xl">0.00</div>
        </div>
        <button
          disabled="true"
          class="w-full p-3 bg-accent text-primary-dark rounded-xl font-cairo font-extrabold text-base mt-1 transition-[0.12s] disabled:bg-[#dfe4dc] disabled:text-[#93998f] cursor-not-allowed"
        >
          إتمام البيع وطباعة الفاتورة
        </button>
      </div>
    </div>
    <script>
      const changeTabs = (tab) => {
        const allButtons = document.querySelectorAll("header button");
        allButtons.forEach((btn) => btn.classList.remove("tab"));
        tab.classList.add("tab");
      };
      const changeChips = (chip) => {
        const allChips = document.querySelectorAll(".chip");
        allChips.forEach((btn) => btn.classList.remove("activeChip"));
        chip.classList.add("activeChip");
      };

      seed.forEach((pro) => {
        cards.innerHTML += `
          <div
            class="border-[1.5px] w-38 rounded-xl border-line text-center py-3 px-2.5 transition-[0.12s] hover:border-primary hover:shadow-lg hover:-translate-y-0.5"
          >
            <div class="font-bold text-base mb-1 min-h-9">${pro.name}</div>
            <div class="text-xs text-ink-soft mb-1.5">المتاح :${pro.stock}</div>
            <div class="font-cairo font-extrabold text-primary-dark text-base">
            ${pro.price} ج.م
            </div>
            <button
              class="cursor-pointer mt-2 w-full p-2 bg-primary text-white rounded-lg font-bold text-xs"
            >
              اضافة للسلة
            </button>
          </div>
        `;
      });
    </script>
  </body>
</html>
